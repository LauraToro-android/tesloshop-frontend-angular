<h1 class="text-3xl font-bold font-montserrat">Todos los productos</h1>
<h2 class="text-xl mb-5">Para todos los gustos</h2>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 mt-2 gap-3">
    <div *ngIf="!productsResource.value()?.products?.length">
        No hay productos
    </div>
    <app-product-card *ngFor="let product of productsResource.value()?.products" [product]="product" />
</div>
<app-pagination [pages]="productsResource.value()?.pages ?? 0"
    [currentPage]="paginationService.currentPage()"></app-pagination>
