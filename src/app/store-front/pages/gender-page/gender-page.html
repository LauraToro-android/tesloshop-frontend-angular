<h1 class="text-3xl font-bold font-montserrat">Todos los productos  
    <span class="text-secondary">
       {{ ggender() ? (ggender().charAt(0).toUpperCase() + ggender().slice(1)) : '' }}
    </span>
</h1>
<h2 class="text-xl mb-5">Para todos los gustos</h2>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 mt-2 gap-3">
    <div *ngIf="!productResource().products.length">
        No hay productos
    </div>
    <app-product-card
    *ngFor="let product of productResource()?.products"
    [product]="product"/>
</div>
