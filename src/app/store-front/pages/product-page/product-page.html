@if ( productResource.isLoading() ) {
    <div class="flex justify-center items-center h-screen">
        <span class="loading loading-spinner loading-lg"></span>
    </div>
}
@if ( productResource.hasValue() ) {
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 items-start min-h-screen">
        <div class="flex justify-center items-center p-4">
            <product-carousel class="max-w-full max-h-[90vh] object-contain" 
            [images]="productResource.value().images" />
        </div>
        
        <div>
            <h2 class="text-2xl font-bold font-montserrat mb-3 text-accent">
                {{ productResource.value().title }}
            </h2>
            <div class="divider"></div>
            <p>
                {{ productResource.value().description }}
            </p>
        </div>
    </div>
}
